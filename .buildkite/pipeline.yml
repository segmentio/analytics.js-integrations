env:
  SEGMENT_CONTEXTS: "snyk,npm,aws-credentials,ecr,saucelabs,npm-publish"
  SEGMENT_BUILDKITE_IMAGE: "analytics-next-ci-agent"

steps:
  - label: ":hammer: Build and Test"
    key: "build"
    branches: "!master"
    agents:
      queue: general-039
    command:
      - npm config set "//npmjs.artifacts.twilio.com/artifactory/api/npm/virtual-npm-twilio/:_authToken" $${NPM_TOKEN}
      - yarn install --frozen-lockfile
      - yarn test
    plugins:
      - docker#v3.3.0:
          image: 018537234677.dkr.ecr.us-east-1.amazonaws.com/docker.io/library/node:16.20.2-alpine
          user: root
          environment:
            - NPM_TOKEN
            - CHROME-BIN=google-chrome

  - label: ":hammer: Build and Test Master"
    key: "build_master"
    branches: "master"
    agents:
      queue: general-039
    command:
      - npm config set "//npmjs.artifacts.twilio.com/artifactory/api/npm/virtual-npm-twilio/:_authToken" $${NPM_TOKEN}
      - yarn install --frozen-lockfile
      - yarn test-master
    plugins:
      - ssh://git@github.com/segmentio/cache-buildkite-plugin#v1.0.0:
          key: "v1-cache-dev-{{ checksum 'yarn.lock' }}"
          paths: [ "node_modules/" ]
          s3_bucket_name: "segment-buildkite-cache"
          save: true
      - docker#v3.3.0:
          image: 018537234677.dkr.ecr.us-east-1.amazonaws.com/docker.io/library/node:16.20.2-alpine
          user: root
          environment:
            - NPM_TOKEN
            - CHROME-BIN=google-chrome

  - wait: ~
    depends_on: ["build_master", "sauce_labs_master"]

  - label: ":cloud: Upload Assets to stage bucket"
    branches: master staging
    agents:
      queue: general-039
    command:
      - echo "--- Upload"
      - NODE_ENV=production ./.buildkite/upload.sh
    plugins:
      - ssh://git@github.com/segmentio/cache-buildkite-plugin#v1.0.0:
          key: "v1-cache-dev-{{ checksum 'yarn.lock' }}"
          paths: ["node_modules/"]
          s3_bucket_name: "segment-buildkite-cache"

  - label: ":cloud: Upload Assets to production bucket"
    branches: master
    agents:
      queue: general-039
    command:
      - echo "--- Upload"
      - NODE_ENV=production ./.buildkite/publish.sh
    plugins:
      - ssh://git@github.com/segmentio/cache-buildkite-plugin#v1.0.0:
          key: "v1-cache-dev-{{ checksum 'yarn.lock' }}"
          paths: ["node_modules/"]
          s3_bucket_name: "segment-buildkite-cache"
