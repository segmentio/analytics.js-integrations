env:
  SEGMENT_CONTEXTS: "snyk,npm,aws-credentials,ecr,saucelabs,npm-publish"
  SEGMENT_BUILDKITE_IMAGE: "analytics-next-ci-agent"

steps:
  - label: ":hammer: Build and Test"
    key: "build"
    branches: "!master"
    agents:
      queue: general-039
    command:
      - npm config set "//npmjs.artifacts.twilio.com/artifactory/api/npm/virtual-npm-twilio/:_authToken" $${NPM_TOKEN}
      - yarn install --frozen-lockfile
      - yarn test
    plugins:
      # Builds .buildkite/Dockerfile.ci (node + Chromium from the Twilio
      # mirrors) and runs the command inside it. Replaces the bare docker
      # plugin, whose image had no browser for Karma's ChromeHeadless tests.
      - docker-compose#v5.12.1:
          run: app
          config: docker-compose-ci.yml
          mount-checkout: true
          propagate-environment: true

  - label: ":hammer: Build and Test Master"
    key: "build_master"
    branches: "master"
    agents:
      queue: general-039
    command:
      - npm config set "//npmjs.artifacts.twilio.com/artifactory/api/npm/virtual-npm-twilio/:_authToken" $${NPM_TOKEN}
      - yarn install --frozen-lockfile
      - yarn test-master
    plugins:
      - docker-compose#v5.12.1:
          run: app
          config: docker-compose-ci.yml
          mount-checkout: true
          propagate-environment: true

  - wait: ~
    depends_on: ["build_master"]

  - label: ":cloud: Upload Assets to stage bucket"
    branches: master staging
    agents:
      queue: general-039
    command:
      - echo "--- Upload"
      - NODE_ENV=production ./.buildkite/upload.sh

  - label: ":cloud: Upload Assets to production bucket"
    branches: master
    agents:
      queue: general-039
    command:
      - echo "--- Upload"
      - NODE_ENV=production ./.buildkite/publish.sh
