agents:
  queue: general-039

env:
  SEGMENT_CONTEXTS: "snyk,npm,aws-credentials,ecr,saucelabs,npm-publish"
  NODE_BROWSER_IMAGE: "018537234677.dkr.ecr.us-east-1.amazonaws.com/docker.io/library/node:22.23.4-alpine3.24"
  AJS_CI_IMAGE: "018537234677.dkr.ecr.us-east-1.amazonaws.com/docker.io/library/node:22.23.4-alpine3.24"
  CHROME_BIN: "/usr/bin/chromium-browser"

steps:
  - label: ":hammer: Build and Test"
    key: "build"
    branches: "!master"
    command:
      - apk add --no-cache chromium nss freetype harfbuzz ca-certificates ttf-freefont git openssh-client python3 g++ make
      - npm config set "//npmjs.artifacts.twilio.com/artifactory/api/npm/virtual-npm-twilio/:_authToken" $${NPM_TOKEN}
      - yarn install --frozen-lockfile
      - make build
      - yarn test
      - buildkite-agent artifact upload 'build/**/*'
    plugins:
    - docker#v5.12.0:
        image: '${NODE_BROWSER_IMAGE}'
        mount-ssh-agent: true
        mount-buildkite-agent: true
        propagate-environment: true

  - label: ":hammer: Build and Test Master"
    key: "build_master"
    branches: "master"
    command:
      - apk add --no-cache chromium nss freetype harfbuzz ca-certificates ttf-freefont git openssh-client python3 g++ make
      - npm config set "//npmjs.artifacts.twilio.com/artifactory/api/npm/virtual-npm-twilio/:_authToken" $${NPM_TOKEN}
      - yarn install --frozen-lockfile
      - make build
      - yarn test-master
      - buildkite-agent artifact upload 'build/**/*'
    plugins:
    - docker#v5.12.0:
        image: '${NODE_BROWSER_IMAGE}'
        mount-ssh-agent: true
        mount-buildkite-agent: true
        propagate-environment: true

  - label: "SauceLabs"
    key: "sauce_labs"
    branches: "!master"
    soft_fail: true
    command:
      - apk add --no-cache chromium nss freetype harfbuzz ca-certificates ttf-freefont git openssh-client python3 g++ make
      - npm config set "//npmjs.artifacts.twilio.com/artifactory/api/npm/virtual-npm-twilio/:_authToken" $${NPM_TOKEN}
      - yarn install --ignore-engines
      - yarn test:ci
    plugins:
      - docker#v5.12.0:
          image: '${NODE_BROWSER_IMAGE}'
          mount-ssh-agent: true
          propagate-environment: true

  - label: "SauceLabs Master"
    key: "sauce_labs_master"
    branches: "master"
    soft_fail: true
    command:
      - apk add --no-cache chromium nss freetype harfbuzz ca-certificates ttf-freefont git openssh-client python3 g++ make
      - npm config set "//npmjs.artifacts.twilio.com/artifactory/api/npm/virtual-npm-twilio/:_authToken" $${NPM_TOKEN}
      - yarn install --ignore-engines
      - yarn test-master:ci
    plugins:
      - docker#v5.12.0:
          image: '${AJS_CI_IMAGE}'
          mount-ssh-agent: true
          propagate-environment: true

  - label: ":cloud: Upload Assets to stage bucket (from master branch)"
    branches: master
    depends_on:
      - "build_master"
      - "sauce_labs_master"
    command:
      - echo "--- Upload"
      - ./.buildkite/upload.sh

  - label: ":cloud: Upload Assets to stage bucket (from staging branch)"
    branches: staging
    depends_on:
      - "build"
      - "sauce_labs"
    command:
      - echo "--- Upload"
      - ./.buildkite/upload.sh

  - label: ":cloud: Upload Assets to production bucket (from master branch)"
    branches: master
    depends_on:
      - "build_master"
      - "sauce_labs_master"
    command:
      - echo "--- Upload"
      - ./.buildkite/publish.sh